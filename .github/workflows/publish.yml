name: Track upstream and publish

# HF discovery stays here. Dependabot only maintains the Python base and actions.
# The publish job verifies its local build before any registry tag can move.
on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, '.github/**', 'scripts/**']
  push:
    paths: [Dockerfile, '.github/**', 'scripts/**']
  schedule:
    # HF release detection and a weekly refresh of upstream-allowed dependencies.
    - cron: '23 */6 * * *'
    - cron: '47 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh the base and allowed dependencies for the current HF version'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hf-cli
  REGISTRY_REPO: ${{ github.repository_owner }}/hf-cli
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST_ACCEPT: 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json'

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify maintenance boundary checks
        run: bash .github/scripts/test-maintenance.sh
      - name: Build and verify the recipe without publishing
        env:
          BUILD_METADATA: ${{ runner.temp }}/hf-verify-build.json
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          version="$(curl -fsS --retry 3 --connect-timeout 10 https://pypi.org/pypi/huggingface_hub/json | resolve_version)"
          ref="hf-cli-check:${SOURCE_SHA}"
          build_image "$ref" "$version"
          bash scripts/verify-image.sh "$ref" "$version"

  track-and-publish:
    needs: verify
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify maintenance boundary checks
        run: bash .github/scripts/test-maintenance.sh

      - name: Resolve the upstream release
        id: up
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          version="$(curl -fsS --retry 3 --connect-timeout 10 \
            https://pypi.org/pypi/huggingface_hub/json | resolve_version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::upstream huggingface_hub == $version"

      - name: Decide what needs doing
        id: decide
        env:
          V: ${{ steps.up.outputs.version }}
          FORCE: ${{ inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          tok="$(registry_token)"
          version_probe="$(registry_probe "$V" "$tok")"
          latest_probe="$(registry_probe latest "$tok")"
          read -r vcode vdigest <<< "$version_probe"
          read -r lcode ldigest <<< "$latest_probe"
          echo "::notice::${V} -> HTTP ${vcode} ${vdigest}; latest -> HTTP ${lcode} ${ldigest}"
          tag_missing=true
          if git_tag_exists "$V"; then tag_missing=false; else
            status=$?; [ "$status" = 1 ] || exit "$status"
          fi
          rel_missing=true
          if release_exists "$V"; then rel_missing=false; else
            status=$?; [ "$status" = 1 ] || exit "$status"
          fi
          build="$(needs_build "$vcode" "$FORCE" "$EVENT_NAME" "$EVENT_SCHEDULE")"
          sync="$(needs_sync "$build" "$lcode" "$vdigest" "$ldigest" "$tag_missing" "$rel_missing")"
          echo "::notice::build=${build}, event=${EVENT_NAME}, schedule=${EVENT_SCHEDULE}, force=${FORCE}"
          [ "$sync" = "false" ] && echo "::notice::${IMAGE}:${V} published and fully synced — nothing to do"
          {
            echo "build=$build"
            echo "sync=$sync"
            echo "version_digest=$vdigest"
            echo "latest_digest=$ldigest"
          } >> "$GITHUB_OUTPUT"

      - name: Build locally
        id: build
        if: steps.decide.outputs.build == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          BUILD_METADATA: ${{ runner.temp }}/hf-publish-build.json
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          build_image "${IMAGE}:${V}" "$V"
          config_id="$(jq -er '."containerimage.config.digest"' "$BUILD_METADATA")"
          echo "config_id=$config_id" >> "$GITHUB_OUTPUT"

      - name: Prove the image before anything is publishable
        if: steps.decide.outputs.build == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-image.sh "${IMAGE}:${V}" "$V"
          label="$(docker inspect "${IMAGE}:${V}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          [ "$label" = "${V}" ] || { echo "::error::label '${label}' != '${V}'"; exit 1; }

      - name: Log in to GHCR
        if: steps.decide.outputs.sync == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push the verified version tag
        if: steps.decide.outputs.build == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          assert_current_main
          docker push "${IMAGE}:${V}"

      - name: Gate — the published tag must be anonymously pullable
        id: artifact
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          BUILT: ${{ steps.decide.outputs.build }}
          PREVIOUS_DIGEST: ${{ steps.decide.outputs.version_digest }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          tok="$(registry_token)"
          result="$(registry_probe "$V" "$tok")"
          read -r code digest <<< "$result"
          [ "$code" = 200 ] || { echo '::error::published version is absent'; exit 1; }
          if [ "$BUILT" = false ] && [ "$digest" != "$PREVIOUS_DIGEST" ]; then
            echo '::error::version digest changed during reconcile'; exit 1
          fi
          echo "Anonymous published artifact: ${IMAGE}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Pull the exact verified artifact; `latest` moves last and must retain its digest.
      - name: Move latest
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          VERIFIED_CONFIG: ${{ steps.build.outputs.config_id }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          tok="$(registry_token)"
          published_config="$(registry_config "$DIGEST" "$tok")"
          if [ -n "$VERIFIED_CONFIG" ] && [ "$published_config" != "$VERIFIED_CONFIG" ]; then
            echo '::error::published config differs from the verified build metadata'; exit 1
          fi
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "${IMAGE}:latest"
          assert_current_main
          docker push "${IMAGE}:latest"
          tok="$(registry_token)"
          version_probe="$(registry_probe "$V" "$tok")"
          latest_probe="$(registry_probe latest "$tok")"
          read -r vcode vd <<< "$version_probe"
          read -r lcode ld <<< "$latest_probe"
          echo "Readback ${V} -> HTTP ${vcode} ${vd}; latest -> HTTP ${lcode} ${ld}"
          [ "$vcode" = 200 ] && [ "$lcode" = 200 ] && [ "$vd" = "$DIGEST" ] && [ "$ld" = "$DIGEST" ] || {
            echo '::error::version/latest did not resolve to the published artifact'; exit 1;
          }

      # Audit ref for the recipe. Create-only: a `force` rebuild of an existing version does
      # not move it — the authoritative recipe pointer for any published image is its
      # org.opencontainers.image.revision label.
      - name: Tag the release in git
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          if git_tag_exists "$V"; then
            echo "::notice::git tag ${V} already exists"
          else
            status=$?; [ "$status" = 1 ] || exit "$status"
            git tag "${V}"
            git push origin "refs/tags/${V}"
          fi

      - name: Ensure the GitHub Release exists
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          if release_exists "$V"; then
            echo "::notice::release ${V} already exists"
          else
            status=$?; [ "$status" = 1 ] || exit "$status"
            gh release create "${V}" --verify-tag \
              --title "hf-cli ${V}" \
              --notes "Packages upstream [huggingface_hub ${V}](https://github.com/huggingface/huggingface_hub/releases/tag/v${V}) as \`${IMAGE}:${V}\`. \`latest\` now points at this version."
          fi

      # Keep the existing age-gated branch activity; GITHUB_TOKEN does not retrigger push CI.
      - name: Keepalive — the schedule dies after 60 quiet days, and tag pushes do not count
        env:
          KEEPALIVE_AFTER_DAYS: 40
        run: |
          set -euo pipefail
          last="$(git log -1 --format=%ct)"
          age_days="$(( ( $(date +%s) - last ) / 86400 ))"
          echo "default-branch HEAD is ${age_days} days old"
          if [ "${age_days}" -lt "${KEEPALIVE_AFTER_DAYS}" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keepalive — a public repo's schedule is disabled after 60 quiet days"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        env:
          V: ${{ steps.up.outputs.version }}
          BUILT: ${{ steps.decide.outputs.build }}
          SYNCED: ${{ steps.decide.outputs.sync }}
          PREVIOUS_VERSION_DIGEST: ${{ steps.decide.outputs.version_digest }}
          PREVIOUS_LATEST_DIGEST: ${{ steps.decide.outputs.latest_digest }}
          PUBLISHED_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          {
            echo "### hf-cli"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream huggingface_hub | \`${V}\` |"
            echo "| Built this run | ${BUILT:-n/a} |"
            echo "| Sync work this run | ${SYNCED:-n/a} |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Recipe SHA | \`${SOURCE_SHA}\` |"
            echo "| Base reference | \`$(sed -n 's/^FROM //p' Dockerfile)\` |"
            echo "| Previous version digest | \`${PREVIOUS_VERSION_DIGEST:-n/a}\` |"
            echo "| Previous latest digest | \`${PREVIOUS_LATEST_DIGEST:-n/a}\` |"
            echo "| Published artifact | \`${IMAGE}@${PUBLISHED_DIGEST:-n/a}\` |"
          } >> "${GITHUB_STEP_SUMMARY:-/tmp/summary.md}"
