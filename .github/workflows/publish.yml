name: Track upstream and publish

# HF discovery stays here. The Python base floats on its minor version and is pulled on every build.
# Pull requests run the verify job. The publish job verifies its own build before any
# registry tag can move.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [Dockerfile, '.github/**', 'scripts/**']
  schedule:
    # HF release detection and a weekly refresh of upstream-allowed dependencies.
    - cron: '23 */6 * * *'
    - cron: '47 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh the base and allowed dependencies for the current HF version'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hf-cli
  REGISTRY_REPO: ${{ github.repository_owner }}/hf-cli
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST_ACCEPT: 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json'

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify maintenance boundary checks
        run: bash .github/scripts/test-maintenance.sh
      - name: Build and verify the recipe without publishing
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          version="$(curl -fsS --retry 3 --connect-timeout 10 https://pypi.org/pypi/huggingface_hub/json | resolve_version)"
          ref="hf-cli-check:${SOURCE_SHA}"
          build_image "$ref" "$version"
          bash scripts/verify-image.sh "$ref" "$version"

  track-and-publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the upstream release
        id: up
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          version="$(curl -fsS --retry 3 --connect-timeout 10 \
            https://pypi.org/pypi/huggingface_hub/json | resolve_version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::upstream huggingface_hub == $version"

      - name: Decide what needs doing
        id: decide
        env:
          V: ${{ steps.up.outputs.version }}
          FORCE: ${{ inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          tok="$(registry_token)"
          version_probe="$(registry_probe "$V" "$tok")"
          latest_probe="$(registry_probe latest "$tok")"
          read -r vcode vdigest <<< "$version_probe"
          read -r lcode ldigest <<< "$latest_probe"
          echo "::notice::${V} -> HTTP ${vcode} ${vdigest}; latest -> HTTP ${lcode} ${ldigest}"
          tag_missing=true
          if git_tag_exists "$V"; then tag_missing=false; else
            status=$?; [ "$status" = 1 ] || exit "$status"
          fi
          rel_missing=true
          if release_exists "$V"; then rel_missing=false; else
            status=$?; [ "$status" = 1 ] || exit "$status"
          fi
          build="$(needs_build "$vcode" "$FORCE" "$EVENT_NAME" "$EVENT_SCHEDULE")"
          sync="$(needs_sync "$build" "$lcode" "$vdigest" "$ldigest" "$tag_missing" "$rel_missing")"
          echo "::notice::build=${build}, event=${EVENT_NAME}, schedule=${EVENT_SCHEDULE}, force=${FORCE}"
          [ "$sync" = "false" ] && echo "::notice::${IMAGE}:${V} published and fully synced — nothing to do"
          {
            echo "build=$build"
            echo "sync=$sync"
            echo "version_digest=$vdigest"
          } >> "$GITHUB_OUTPUT"

      - name: Build locally
        if: steps.decide.outputs.build == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          build_image "${IMAGE}:${V}" "$V"

      - name: Prove the image before anything is publishable
        if: steps.decide.outputs.build == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-image.sh "${IMAGE}:${V}" "$V"

      - name: Log in to GHCR
        if: steps.decide.outputs.sync == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push the verified version tag
        if: steps.decide.outputs.build == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${V}"

      - name: Gate — the published tag must be anonymously pullable
        id: artifact
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          BUILT: ${{ steps.decide.outputs.build }}
          PREVIOUS_DIGEST: ${{ steps.decide.outputs.version_digest }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          tok="$(registry_token)"
          result="$(registry_probe "$V" "$tok")"
          read -r code digest <<< "$result"
          [ "$code" = 200 ] || { echo '::error::published version is absent'; exit 1; }
          if [ "$BUILT" = false ] && [ "$digest" != "$PREVIOUS_DIGEST" ]; then
            echo '::error::version digest changed during reconcile'; exit 1
          fi
          echo "Anonymous published artifact: ${IMAGE}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Pull the exact verified artifact; `latest` moves last and must retain its digest.
      - name: Move latest
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          tok="$(registry_token)"
          assert_published_schema2 "$DIGEST" "$tok"
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
          tok="$(registry_token)"
          version_probe="$(registry_probe "$V" "$tok")"
          latest_probe="$(registry_probe latest "$tok")"
          read -r vcode vd <<< "$version_probe"
          read -r lcode ld <<< "$latest_probe"
          echo "Readback ${V} -> HTTP ${vcode} ${vd}; latest -> HTTP ${lcode} ${ld}"
          [ "$vcode" = 200 ] && [ "$lcode" = 200 ] && [ "$vd" = "$DIGEST" ] && [ "$ld" = "$DIGEST" ] || {
            echo '::error::version/latest did not resolve to the published artifact'; exit 1;
          }

      # Audit ref for the recipe. Create-only: a `force` rebuild of an existing version does
      # not move it — the authoritative recipe pointer for any published image is its
      # org.opencontainers.image.revision label.
      - name: Tag the release in git
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          if git_tag_exists "$V"; then
            echo "::notice::git tag ${V} already exists"
          else
            status=$?; [ "$status" = 1 ] || exit "$status"
            git tag "${V}"
            git push origin "refs/tags/${V}"
          fi

      - name: Ensure the GitHub Release exists
        if: steps.decide.outputs.sync == 'true'
        env:
          V: ${{ steps.up.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/maintenance.sh
          if release_exists "$V"; then
            echo "::notice::release ${V} already exists"
          else
            status=$?; [ "$status" = 1 ] || exit "$status"
            gh release create "${V}" --verify-tag \
              --title "hf-cli ${V}" \
              --notes "Packages upstream [huggingface_hub ${V}](https://github.com/huggingface/huggingface_hub/releases/tag/v${V}) as \`${IMAGE}:${V}\`. \`latest\` now points at this version."
          fi

      # A public repo's schedule is disabled after 60 days without repository activity, and
      # tag pushes do not count. Re-enabling the workflow through the API keeps it alive.
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/enable"
